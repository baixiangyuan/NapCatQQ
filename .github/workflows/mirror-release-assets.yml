name: Mirror Release Assets

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source repo (owner/name)'
        required: true
        default: 'XingYunStar/NapCatQQ'
      tags:
        description: 'Space separated tags to mirror'
        required: true
        default: 'v4.18.42 v4.18.19 v4.17.23 v4.15.0'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ inputs.source }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -uo pipefail
          failed=0
          for tag in $TAGS; do
            echo "::group::$tag"
            dir="$RUNNER_TEMP/$tag"
            mkdir -p "$dir"
            gh api "repos/$SOURCE/releases/tags/$tag" --jq '.assets[].name' > "$dir/../names.txt"
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              if [ -s "$dir/$name" ]; then echo "cached: $name"; continue; fi
              ok=0
              for attempt in 1 2 3 4; do
                if gh release download "$tag" -R "$SOURCE" --pattern "$name" --dir "$dir" --clobber; then ok=1; break; fi
                echo "retry $attempt for $name"; sleep 10
              done
              if [ "$ok" != "1" ]; then echo "::warning::download failed: $name"; failed=1; fi
            done < "$dir/../names.txt"
            du -sh "$dir" || true
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              up=0
              for attempt in 1 2 3 4; do
                if gh release upload "$tag" -R "$GITHUB_REPOSITORY" "$f" --clobber; then up=1; break; fi
                echo "retry upload $attempt for $f"; sleep 10
              done
              if [ "$up" != "1" ]; then echo "::warning::upload failed: $f"; failed=1; fi
            done
            echo "::endgroup::"
          done
          if [ "$failed" != "0" ]; then echo "::error::some assets failed"; exit 1; fi